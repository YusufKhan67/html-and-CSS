
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor's Appointment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 30px;
        }

        h1 {
            color: #2563a6;
            text-align: center;
        }

        p {
            text-align: center;
            color: #555;
        }

        form {
            background-color: white;
            max-width: 500px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
        }

        fieldset {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        legend {
            color: #2563a6;
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"],
        input[type="date"],
        select,
        textarea {
            width: 95%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input[type="submit"] {
            background-color: #2563a6;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #174675;
        }
    </style>
</head>

<body>

    <h1>My Doctor's Appointment</h1>
    <p>Fill in the form below to book your appointment</p>
    <hr>

    <form>

        <fieldset>
            <legend>Personal Details</legend>

            <label>Your Name</label><br>
            <input type="text" id="name" placeholder="Enter your full name"><br><br>

            <label>Patient ID</label><br>
            <input type="password" id="pid" placeholder="Your secret ID"><br><br>

            <label>Date of Birth</label><br>
            <input type="date" id="dob"><br>
        </fieldset>

        <fieldset>
            <legend>Your Visit</legend>

            <label>Select a Doctor</label><br>
            <select id="doctor">
                <option value="">--Select a Doctor--</option>
                <option value="dr-ray">Dr. Ray - General</option>
                <option value="dr-yusuf">Dr. Yusuf - Heart</option>
                <option value="dr-sam">Dr. Sam - Eyes</option>
            </select><br><br>

            <label>Why are you visiting?</label><br>
            <input type="radio" name="reason" value="fever"> Fever<br>
            <input type="radio" name="reason" value="cold"> Cold<br>
            <input type="radio" name="reason" value="checkup"> Checkup<br>
            <input type="radio" name="reason" value="tooth"> Tooth Pain<br><br>

            <label>Any notes for the Doctor?</label><br>
            <textarea id="notes" rows="3" cols="35"
            placeholder="e.g. I have had a sore throat for 2 days."></textarea>
        </fieldset>

        <fieldset>
            <legend>Preferred Visit Day</legend>

            <input type="checkbox" value="mon"> Monday<br>
            <input type="checkbox" value="wed"> Wednesday<br>
            <input type="checkbox" value="fri"> Friday<br>
        </fieldset>

        <br>

        <input type="submit" value="Book my Appointment">

    </form>

</body>
</html>
