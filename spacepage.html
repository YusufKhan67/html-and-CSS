<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My space  Page</title>
    <style>
        body {
            background-color: darkblue;
            background-image: linear-gradient(to botton, darkblue, navy);
            background-repeat: no-repeat;
            background-position: top center;
            font-family: Arial, sans-serif;
        }

        .page-header {
            background-image: linear-gradient(to right, purple, coral);
            border-radius: 16px;
            text-align: center;
            color: white;
        }
        .fact-card {
            background-color: midnightblue;
            border-radius: 12px;
            color: white;
        }
        .fact-card h2 {
            color: coral;
        }
        .star {
            width: 60px;
            height: 60px;
            background-color: yellow;
            border-radius: 50%;
            animation: twinkle 2s infinite alternate;
        }

        @keyframes twinkle {
            from { background-color: yellow; }
            to { background-color: white;}
            
        }

        .footer-text {
            text-align: center;
            color: coral;
        }
    </style>
</head>
<body>
    <div class="page-header">
    <h1>My space Page</h1>
    <p>Welcome to my corner of the galaxy!</p>
    </div>
    
    <div class="fact card">
        <h2>Fun Space Fact</h2>
        <p>The Sun is so big that 1 million Earth could fit inside it</p>

    </div>

    <div class="star"></div>
    <p class="fonter-text">Made by Yusuf <br> ^^</p>
</body>
</html>
